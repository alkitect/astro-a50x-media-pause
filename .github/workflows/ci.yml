name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: bash -n
        run: bash -n scripts/*.sh scripts/lib/*.sh
      - name: intent fixtures
        run: ./scripts/run-intent-fixtures.sh
      - name: ci-check
        run: ./scripts/ci-check.sh
